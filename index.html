<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hueder & Ludimila | Nosso Casamento</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f0e7;
      color: #453e34;
      padding: 25px;
    }

    .convite {
      width: 100%;
      max-width: 520px;
      min-height: 700px;
      background: #fffdf8;
      border: 1px solid #c8b998;
      box-shadow: 0 15px 45px rgba(0,0,0,.15);
      text-align: center;
      padding: 60px 35px;
      position: relative;
    }

    .convite::before {
      content: "";
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      bottom: 14px;
      border: 1px solid #d8ccb5;
      pointer-events: none;
    }

    .monograma {
      font-size: 23px;
      letter-spacing: 5px;
      color: #9a8156;
      margin-bottom: 50px;
    }

    .subtitulo {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 20px;
      color: #806f59;
    }

    h1 {
      font-size: 46px;
      font-weight: normal;
      line-height: 1.15;
      margin-bottom: 20px;
      color: #40372f;
    }

    .e {
      display: block;
      font-size: 25px;
      margin: 5px 0;
      color: #a68b5b;
      font-style: italic;
    }

    .data {
      margin-top: 35px;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .local {
      margin-top: 13px;
      font-size: 15px;
      line-height: 1.7;
      color: #71675a;
    }

    .escolha {
      margin-top: 50px;
      margin-bottom: 20px;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .botoes {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 310px;
      margin: auto;
    }

    .botao {
      display: block;
      padding: 16px;
      text-decoration: none;
      color: white;
      background: #756246;
      border: 1px solid #756246;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .rodape {
      margin-top: 45px;
      font-size: 13px;
      font-style: italic;
      color: #9a8d7c;
    }

    @media (max-width: 500px) {
      .convite {
        padding: 50px 25px;
      }

      h1 {
        font-size: 39px;
      }
    }
  </style>
</head>

<body>

  <main class="convite">

    <div class="monograma">H ♥ L</div>

    <div class="subtitulo">
      Nosso Casamento
    </div>

    <h1>
      Hueder
      <span class="e">&</span>
      Ludimila
    </h1>

    <div class="data">
      28 · 11 · 2026
    </div>

    <div class="local">
      Parque Don Martín · Área 6<br>
      Hernandarias
    </div>

    <div class="escolha">
      Escolha seu idioma
    </div>

    <div class="botoes">

      <a class="botao"
         href="CONVITE.DE.CASAMENTO.HUEDER%26LUDIMILA%20.pdf"
         target="_blank">
         Português
      </a>

      <a class="botao"
         href="INVITACI%C3%93N.DE.MATRIMONIO.HUEDER%26LUDIMILA%20.pdf"
         target="_blank">
         Español
      </a>

    </div>

    <div class="rodape">
      Será uma alegria celebrar este momento com você.
    </div>

  </main>

</body>
</html>
