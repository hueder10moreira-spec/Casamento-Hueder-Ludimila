<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hueder & Ludimila</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background:
        linear-gradient(rgba(20, 30, 20, 0.35), rgba(20, 30, 20, 0.35)),
        url("capa.jpg") center center / cover no-repeat fixed;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
      padding: 45px 25px;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
    }

    h1 {
      font-size: 38px;
      color: #344735;
      margin-bottom: 8px;
      font-weight: normal;
    }

    .subtitulo {
      font-size: 17px;
      color: #756b60;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    .idioma {
      display: block;
      width: 100%;
      padding: 17px;
      margin: 15px 0;
      text-decoration: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .portugues {
      background: #526b52;
      color: white;
      border: 2px solid #526b52;
    }

    .espanhol {
      background: transparent;
      color: #526b52;
      border: 2px solid #526b52;
    }

    .idioma:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .data {
      margin-top: 30px;
      font-size: 15px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Hueder & Ludimila</h1>

    <p class="subtitulo">
      Escolha seu idioma • Elige tu idioma
    </p>

    <!-- CONVITE EM PORTUGUÊS -->
    <a
      class="idioma portugues"
      href="./convite-portugues.pdf"
      target="_blank">
      🇧🇷 VER CONVITE EM PORTUGUÊS
    </a>

    <!-- INVITACIÓN EN ESPAÑOL -->
    <a
      class="idioma espanhol"
      href="./convite-espanhol.pdf"
      target="_blank">
      🇵🇾 VER INVITACIÓN EN ESPAÑOL
    </a>

    <p class="data">
      28 • 11 • 2026
    </p>

  </div>

</body>
</html>
